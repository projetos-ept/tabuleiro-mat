<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada Matemática - Gerador de Tabuleiros</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;900&display=swap');

    /* =========================================================
       RESET E BASE UI
       ========================================================= */
    :root {
        --bg: #f1f5f9; --text: #334155; --primary: #3b82f6; 
        --panel-bg: #ffffff; --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { 
        margin: 0; padding: 0; background: var(--bg); color: var(--text);
        font-family: 'Nunito', sans-serif; display: flex; flex-direction: column;
        height: 100vh; overflow: hidden;
    }

    .app-container { display: flex; width: 100%; height: 100%; }
    
    .sidebar {
        width: 420px; background: var(--panel-bg); border-right: 1px solid var(--border);
        overflow-y: auto; padding: 25px; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        z-index: 10; display: flex; flex-direction: column; gap: 20px;
    }
    
    .preview-area {
        flex-grow: 1; overflow: auto; padding: 40px; display: flex; 
        flex-direction: column; align-items: center; background: #94a3b8;
    }

    h1 { font-family: 'Fredoka', sans-serif; font-size: 26px; color: #0f172a; margin: 0; line-height: 1.1; }
    h3 { font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin: 0 0 12px 0; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
    
    .control-group { background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
    
    .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .input-row label { font-weight: 700; font-size: 14px; }
    .input-row input[type="text"], .input-row input[type="number"] {
        padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-family: 'Nunito';
        font-weight: 700; width: 120px; text-align: center; outline: none; transition: 0.2s;
    }
    .input-row input:focus { border-color: var(--primary); }
    .input-row input.wide { width: 180px; text-align: left; }
    
    .slider-container { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
    .slider-container label { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
    .slider-container input[type="range"] { width: 100%; cursor: pointer; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;}
    button {
        padding: 10px 15px; border: none; border-radius: 8px; font-weight: 800; font-family: 'Nunito';
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        background: #e2e8f0; color: #334155; font-size: 14px;
    }
    button:hover { background: #cbd5e1; transform: translateY(-1px); }
    button.btn-primary { background: var(--primary); color: white; }
    button.btn-primary:hover { background: #2563eb; }
    button.btn-success { background: #10b981; color: white; }
    button.btn-success:hover { background: #059669; }
    button.btn-dark { background: #0f172a; color: white; }
    button.btn-dark:hover { background: #000; }
    button.btn-warning { background: #f59e0b; color: white; }
    button.btn-warning:hover { background: #d97706; }

    .event-btns button { font-size: 12px; padding: 8px; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; background: #e0f2fe; padding: 12px; border-radius: 10px; color: #0369a1; border: 1px solid #bae6fd; cursor: pointer;}
    .switch-row input { transform: scale(1.5); cursor: pointer; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
    .checkbox-label input { transform: scale(1.2); }

    /* =========================================================
       MODAL DE GERENCIAMENTO DE CARTAS
       ========================================================= */
    #modal-cartas {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.7); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-content {
        background: #ffffff; width: 90%; max-width: 800px; height: 85vh; border-radius: 16px;
        display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .modal-header {
        padding: 20px; background: #f8fafc; border-bottom: 2px solid var(--border);
        display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { margin: 0; font-family: 'Fredoka'; color: #0f172a; }
    .modal-toolbar { padding: 15px 20px; background: #ffffff; display: flex; gap: 10px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; background: #f1f5f9; display: flex; flex-direction: column; gap: 15px; }
    .modal-footer { padding: 15px 20px; background: #ffffff; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px;}
    
    .carta-item { background: #ffffff; border: 2px solid var(--border); border-radius: 12px; padding: 15px; position: relative; }
    .carta-item h4 { margin: 0 0 10px 0; color: var(--primary); font-family: 'Fredoka'; display: flex; justify-content: space-between;}
    .carta-item input, .carta-item textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Nunito'; font-weight: 700; margin-bottom: 10px; }
    .btn-remove { background: #ef4444; color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; }

    /* =========================================================
       ÁREA DE IMPRESSÃO / SVG
       ========================================================= */
    .a4-landscape {
        width: 297mm; height: 210mm; background: white; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        position: relative; flex-shrink: 0; border-radius: 4px; overflow: hidden;
    }
    
    svg { width: 100%; height: 100%; display: block; }
    .casa-shape { transition: fill 0.3s; cursor: pointer; }
    .casa-shape:hover { fill: #f1f5f9; }
    .casa-shape.selecionada { stroke: var(--primary); stroke-width: 12; stroke-dasharray: 20; z-index: 100; }
    .text-num { font-family: 'Fredoka', sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; paint-order: stroke fill; stroke-width: 8px; stroke: white; fill: black; pointer-events: none;}
    .text-val { font-family: 'Fredoka', sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: white; pointer-events: none;}
    
    /* =========================================================
       CARTAS (OCULTAS NA TELA, VISÍVEIS NA IMPRESSÃO)
       ========================================================= */
    #print-cards-container { display: none; }

    @media print {
        body, html { width: 100%; height: 100%; background: white; overflow: visible; }
        .sidebar, #modal-cartas { display: none !important; }
        .preview-area { padding: 0; background: none; display: block; overflow: visible; }
        .a4-landscape { box-shadow: none; border-radius: 0; page-break-after: always; width: 297mm; height: 210mm; }
        
        #print-cards-container { display: block; }
        .card-page { width: 297mm; height: 210mm; padding: 10mm; page-break-after: always; box-sizing: border-box; }
        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 0; width: 100%; height: 100%; border: 2px dashed #94a3b8; }
        .card { border: 1px dashed #94a3b8; padding: 6mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .card h4 { font-family: 'Fredoka'; margin: 0 0 10px 0; font-size: 18px; border-bottom: 2px solid black; padding-bottom: 5px; width: 100%; }
        .card-q { font-size: 16px; font-weight: 700; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .card-r { font-size: 12px; font-weight: 900; background: #f1f5f9; padding: 5px; border-radius: 5px; margin-bottom: 15px; width: 100%; border: 1px solid #000; }
        .card-a { font-size: 12px; transform: rotate(180deg); color: #000; border-top: 1px dotted #ccc; padding-top: 5px; width: 100%; font-weight: 700; }
        
        .gabarito-title { font-family: 'Fredoka'; font-size: 30px; text-align: center; border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 20px;}
        .gabarito-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .gab-item { border-bottom: 1px dashed #ccc; padding-bottom: 5px; font-size: 14px; }

        @page { size: A4 landscape; margin: 0; }
    }
</style>
</head>
<body>

<div class="app-container">
    <!-- PAINEL LATERAL -->
    <div class="sidebar no-print">
        <div>
            <h1>Jornada Matemática</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px; color: #64748b; font-weight: 700;">Gerador PRO "Colorir"</p>
        </div>

        <div class="control-group" style="padding: 0;">
            <label class="switch-row">
                <span>🎨 Modo Colorido (Fundo)</span>
                <input type="checkbox" id="inp-colorido" onchange="atualizarTabuleiro()">

        </div>

        <div class="control-group">
            <h3>📏 Geometria e Textos</h3>
            <div class="input-row">
                <label>Título:</label>
                <input type="text" id="inp-titulo" class="wide" value="JORNADA MATEMÁTICA" oninput="atualizarTabuleiro()">
            </div>
            <div class="input-row">
                <label>Subtítulo:</label>

            </div>
            <div class="input-row">
                <label>Total de Casas:</label>
                <input type="number" id="inp-total" value="40" min="20" max="80" oninput="gerarEventosAutomaticos()">
            </div>
            <div style="margin-top: 15px;">

                    <label>Largura da Pista <span><span id="val-largura">167</span>px</span></label>
                    <input type="range" id="inp-largura" min="120" max="260" value="167" oninput="atualizarTabuleiro()">
                </div>
                <div class="slider-container">
                    <label>Qtd. de Fileiras (Zig-Zag) <span><span id="val-linhas">4</span></span></label>

        </div>

        <div class="control-group">

            </div>
            <div class="input-row">
                <label>➡ Avança (Qtd: <input type="number" id="val-a" value="2" style="width:40px; padding:2px; display:inline;" min="1">)</label>
                <input type="number" id="auto-a" value="7" min="0">
            </div>
            <div class="input-row">
                <label>⬅ Volta (Qtd: <input type="number" id="val-v" value="2" style="width:40px; padding:2px; display:inline;" min="1">)</label>
                <input type="number" id="auto-v" value="9" min="0">
            </div>
            <div class="input-row">
                <label>🔄 Troca:</label>
                <input type="number" id="auto-t" value="12" min="0">
            </div>
            <div class="btn-grid">
                <button class="btn-primary" onclick="gerarEventosAutomaticos()">🚀 Gerar Regras</button>
                <button onclick="limparEventos()">🧹 Limpar Tudo</button>

        </div>

        <div class="control-group">
            <h3>✏️ Edição Manual da Pista</h3>
            <p style="font-size: 13px; font-weight: 700; margin-top:0;">Casa Selecionada: <span id="lbl-casa" style="background:#0f172a; color:white; padding:2px 8px; border-radius:12px;">Nenhuma</span></p>
            <div class="btn-grid event-btns">

                <button onclick="setEvento('avanca')">➡ Avança</button>
                <button onclick="setEvento('volta')">⬅ Volta</button>
                <button onclick="setEvento('troca')">🔄 Troca</button>
                <button onclick="setEvento('')" style="grid-column: span 2;">❌ Vazia</button>
            </div>
        </div>

        <div class="control-group">
            <h3>🃏 Cartas e Impressão</h3>
            <button class="btn-warning" onclick="abrirModalCartas()" style="width:100%; margin-bottom: 15px;">📝 Gerenciar Cartas de Pergunta</button>
            
            <label class="checkbox-label">
                <input type="checkbox" id="chk-show-answers"> Imprimir respostas nas cartas (Ponta-cabeça)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-gabarito" checked> Gerar página extra de Gabarito
            </label>
            
            <div class="btn-grid" style="margin-top:15px;">
                <button onclick="embaralharDecoracoes()">🌳 Refazer Fundo</button>
                <button class="btn-dark" onclick="prepararImpressao()">🖨 Imprimir Tudo</button>
                <button onclick="salvarArquivo()">⬇ Baixar Projeto</button>
                <button onclick="document.getElementById('file-load').click()">⬆ Carregar</button>
                <input type="file" id="file-load" style="display:none" accept=".json" onchange="carregarArquivo(event)">
            </div>

    <!-- ÁREA DE PREVIEW (SVG A4) -->
    <div class="preview-area">
        <div class="a4-landscape" id="page-board">
            <svg viewBox="0 0 2970 2100" id="svg-board">

                    <!-- ÍCONE DADO BASE -->

                        <circle cx="70" cy="70" r="10" fill="#000000"/>
                        <circle cx="30" cy="70" r="10" fill="#000000"/>

                    </symbol>
                    
                    <symbol id="dec-grass" viewBox="0 0 50 40">
                        <polygon points="10,40 20,40 15,10" fill="#ffffff" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>
                        <polygon points="20,40 35,40 30,5" fill="#ffffff" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>
                        <polygon points="35,40 45,40 40,20" fill="#ffffff" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>

    <div class="modal-content">
        <div class="modal-header">
            <h2>🃏 Gerenciar Cartas (Baralho)</h2>
            <button onclick="fecharModalCartas()" style="background:none; border:none; font-size:20px; cursor:pointer;">❌</button>
        </div>
        <div class="modal-toolbar">
            <button class="btn-success" onclick="document.getElementById('import-json').click()">📂 Importar JSON</button>
            <input type="file" id="import-json" style="display:none;" accept=".json" onchange="importarJSON(event)">
            <button class="btn-primary" onclick="adicionarCartaUI()">➕ Adicionar Carta</button>
            <span style="font-size: 13px; color:#64748b; margin-left: auto; align-self: center;">Recomendado ter cartas suficientes para as casas de Pergunta.</span>
        </div>
        <div class="modal-body" id="modal-cartas-list">
            <!-- Renderizado via JS -->
        </div>
        <div class="modal-footer">
            <button class="btn-dark" onclick="salvarEFecharModal()">💾 Salvar e Fechar</button>
        </div>
    </div>
</div>

<!-- CONTAINER DE IMPRESSÃO DAS CARTAS E GABARITO -->
<div id="print-cards-container"></div>

<script>
    // =========================================================
    // ESTADO E CONFIGURAÇÕES GERAIS
    // =========================================================
    let estado = {
        casas: [],
        decoracoes: [],
        selecionada: null,
        cartas: [] // Baralho global desvinculado de casas específicas
    };

    const CORES = {
        'pergunta': '#ffedd5', 'avanca': '#dcfce7', 'volta': '#fee2e2',
        'troca': '#f3e8ff', 'padrao1': '#ffffff', 'padrao2': '#f8fafc'
    };

    // =========================================================
    // MOTOR MATEMÁTICO: GERAÇÃO DA FAIXA SINUOSA
    // =========================================================
    function calcularPontosDaPista() {
        let largura = parseInt(document.getElementById('inp-largura').value);
        let linhas = parseInt(document.getElementById('inp-linhas').value);
        let freq = 2; 
        
        let pts = [];
        let startX = 350, endX = 2620; 
        let startY = 600, endY = 1750; 
        
        let rowH = (linhas > 1) ? (endY - startY) / (linhas - 1) : 0;
        if (linhas === 1) startY = (endY + startY) / 2;

        for (let r = 0; r < linhas; r++) {
            let y = startY + r * rowH;
            let dir = (r % 2 === 0) ? 1 : -1; 
            
            let steps = 300;
            for (let i = 0; i <= steps; i++) {
                let t = i / steps; 
                let px = (dir === 1) ? startX + t * (endX - startX) : endX - t * (endX - startX);
                
                let envelope = Math.sin(t * Math.PI); 
                let wave = Math.sin(t * Math.PI * 2 * freq);
                let py = y + 40 * wave * envelope * dir; // amp fixa em 40
                
                pts.push({x: px, y: py});
            }

            if (r < linhas - 1) {
                let cx = (dir === 1) ? endX : startX;
                let cy = y + rowH / 2;
                let rArc = rowH / 2;
                let aStart = (dir === 1) ? -Math.PI/2 : 3 * Math.PI/2;
                let aEnd = (dir === 1) ? Math.PI/2 : Math.PI/2;
                
                let arcSteps = 100;
                for (let i = 1; i <= arcSteps; i++) {
                    let t = i / arcSteps;
                    let a = aStart + t * (aEnd - aStart);
                    pts.push({ x: cx + rArc * Math.cos(a), y: cy + rArc * Math.sin(a) });
                }
            }
        }

        let dist = 0;
        pts[0].d = 0;
        for (let i = 1; i < pts.length; i++) {
            let dx = pts[i].x - pts[i-1].x;
            let dy = pts[i].y - pts[i-1].y;
            dist += Math.hypot(dx, dy);
            pts[i].d = dist;
        }

        for (let i = 0; i < pts.length; i++) {
            let pPrev = pts[Math.max(0, i - 1)];
            let pNext = pts[Math.min(pts.length - 1, i + 1)];
            let dx = pNext.x - pPrev.x;
            let dy = pNext.y - pPrev.y;
            let len = Math.hypot(dx, dy);
            pts[i].nx = -dy / len; 
            pts[i].ny = dx / len;
        }

        return { pts, totalDist: dist };
    }

    // =========================================================
    // RENDERIZAÇÃO DO SVG
    // =========================================================
    function atualizarTabuleiro() {
        document.getElementById('val-largura').textContent = document.getElementById('inp-largura').value;
        document.getElementById('val-linhas').textContent = document.getElementById('inp-linhas').value;
        
        let colorido = document.getElementById('inp-colorido').checked;
        document.getElementById('bg-rect').setAttribute('fill', colorido ? '#e0f2fe' : '#ffffff');

        let geom = calcularPontosDaPista();
        let pts = geom.pts;
        let largura = parseInt(document.getElementById('inp-largura').value);
        let totalCasas = parseInt(document.getElementById('inp-total').value);

        if (estado.casas.length !== totalCasas) {
            gerarEventosAutomaticos();
            return; 
        }

        let layerPista = document.getElementById('layer-pista');
        layerPista.innerHTML = "";
        let pIndex = 0;
        
        for (let c = 0; c < totalCasas; c++) {
            let startD = (c / totalCasas) * geom.totalDist;
            let endD = ((c + 1) / totalCasas) * geom.totalDist;
            let cellPts = [];
            while (pIndex < pts.length && pts[pIndex].d <= endD) {
                cellPts.push(pts[pIndex]);
                pIndex++;
            }
            if (c === totalCasas - 1) { 
                while (pIndex < pts.length) { cellPts.push(pts[pIndex]); pIndex++; }
            } else if (pIndex < pts.length) {
                cellPts.push(pts[pIndex]); 
            }
            
            if (cellPts.length < 2) continue;

            let w = largura;
            let dStr = `M ${cellPts[0].x + cellPts[0].nx * w/2} ${cellPts[0].y + cellPts[0].ny * w/2}`;
            for (let i = 1; i < cellPts.length; i++) {
                dStr += ` L ${cellPts[i].x + cellPts[i].nx * w/2} ${cellPts[i].y + cellPts[i].ny * w/2}`;
            }
            for (let i = cellPts.length - 1; i >= 0; i--) {
                dStr += ` L ${cellPts[i].x - cellPts[i].nx * w/2} ${cellPts[i].y - cellPts[i].ny * w/2}`;
            }
            dStr += " Z";

            let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", dStr);
            path.setAttribute("class", `casa-shape ${estado.selecionada === c ? 'selecionada' : ''}`);
            
            let info = estado.casas[c];
            let fillCor = colorido ? (CORES[info.tipo] || (c % 2 === 0 ? CORES.padrao1 : CORES.padrao2)) : '#ffffff';
            path.setAttribute("fill", fillCor);
            path.setAttribute("stroke", "#000000");
            path.setAttribute("stroke-width", "8"); 
            path.setAttribute("stroke-linejoin", "round");
            path.onclick = () => selecionarCasa(c);
            layerPista.appendChild(path);

            let midPt = cellPts[Math.floor(cellPts.length / 2)];
            adicionarConteudoCasa(layerPista, midPt.x, midPt.y, c, info);
        }

        posicionarSinais(pts[0], pts[pts.length - 1], largura);
        renderizarTextos();
        
        if (estado.decoracoes.length === 0) embaralharDecoracoes(pts, largura);
        else desenharDecoracoesExistentes();
    }

    function adicionarConteudoCasa(layer, x, y, c, info) {
        let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        let hasEvent = info.tipo !== '';
        let numY = y + (hasEvent ? -25 : 5); 
        
        let txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", x);
        txt.setAttribute("y", numY);
        txt.setAttribute("class", "text-num");
        txt.setAttribute("font-size", hasEvent ? "70" : "90");
        txt.textContent = c + 1;
        g.appendChild(txt);

        if (hasEvent) {
            let use = document.createElementNS("http://www.w3.org/2000/svg", "use");
            use.setAttribute("href", `#icon-${info.tipo}`);
            
            let iconSize = 90;
            let iconX = x - iconSize/2;
            let iconY = y - 5;
            
            if (info.tipo === 'avanca' || info.tipo === 'volta') {
                use.setAttribute("width", iconSize * 1.6);
                iconX = x - (iconSize * 1.6)/2;
            } else {
                use.setAttribute("width", iconSize);
            }
            use.setAttribute("height", iconSize);
            use.setAttribute("x", iconX);
            use.setAttribute("y", iconY);
            g.appendChild(use);

            if (info.valor && (info.tipo === 'avanca' || info.tipo === 'volta')) {
                let vTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                let offsetV = info.tipo === 'avanca' ? 38 : -38;
                vTxt.setAttribute("x", x + offsetV);
                vTxt.setAttribute("y", iconY + 47);
                vTxt.setAttribute("class", "text-val");
                vTxt.setAttribute("font-size", "22");
                vTxt.textContent = info.valor;
                g.appendChild(vTxt);
            }
        }
        layer.appendChild(g);
    }

    function posicionarSinais(ptStart, ptEnd, w) {
        let sInicio = document.getElementById('sign-inicio');
        sInicio.setAttribute('transform', `translate(${ptStart.x - w/2 - 100}, ${ptStart.y - 120})`);
        let sChegada = document.getElementById('sign-chegada');
        sChegada.setAttribute('transform', `translate(${ptEnd.x}, ${ptEnd.y + w/2 + 20})`);
    }

    // Correção: Legenda movida para não sobrepor o Título
    function renderizarTextos() {
        let layer = document.getElementById('layer-textos');
        layer.innerHTML = "";
        
        let titulo = document.getElementById('inp-titulo').value;
        let subtitulo = document.getElementById('inp-subtitulo').value;

        // Título ajustado mais para a direita
        let t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", "1700");
        t.setAttribute("y", "230");
        t.setAttribute("font-family", "Fredoka");
        t.setAttribute("font-size", "150");
        t.setAttribute("font-weight", "900");
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "#ffffff");
        t.setAttribute("stroke", "#000000");
        t.setAttribute("stroke-width", "35");
        t.setAttribute("stroke-linejoin", "round");
        t.setAttribute("paint-order", "stroke fill");
        t.setAttribute("filter", "url(#shadow)");
        t.textContent = titulo;
        layer.appendChild(t);

        let sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
        sub.setAttribute("x", "1700");
        sub.setAttribute("y", "330");
        sub.setAttribute("font-family", "Fredoka");
        sub.setAttribute("font-size", "55");
        sub.setAttribute("font-weight", "700");
        sub.setAttribute("text-anchor", "middle");
        sub.setAttribute("fill", "#000000");
        sub.textContent = subtitulo;
        layer.appendChild(sub);

        // Legenda no canto superior esquerdo (Refinada a pedido)
        let gLeg = document.createElementNS("http://www.w3.org/2000/svg", "g");
        gLeg.setAttribute("transform", "translate(100, 80)");
        
        let bgLeg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bgLeg.setAttribute("width", "450"); 
        bgLeg.setAttribute("height", "320"); 
        bgLeg.setAttribute("rx", "20");
        bgLeg.setAttribute("fill", "#ffffff");
        bgLeg.setAttribute("stroke", "#000000");
        bgLeg.setAttribute("stroke-width", "8");
        bgLeg.setAttribute("stroke-dasharray", "20, 15");
        bgLeg.setAttribute("filter", "url(#shadow)");
        gLeg.appendChild(bgLeg);

        const lItems = [
            { t: 'avanca', text: 'Avance casas', y: 30 },
            { t: 'volta', text: 'Volte casas', y: 100 },
            { t: 'troca', text: 'Troque de lugar', y: 170 },
            { t: 'pergunta', text: 'Casa de Pergunta', y: 240 }
        ];

        lItems.forEach(item => {
            let u = document.createElementNS("http://www.w3.org/2000/svg", "use");
            u.setAttribute("href", `#icon-${item.t}`);
            
            if(item.t==='avanca' || item.t==='volta') {
                u.setAttribute("width", "96"); 
                u.setAttribute("height", "60"); 
                u.setAttribute("x", "20"); 
            } else {
                u.setAttribute("width", "60"); 
                u.setAttribute("height", "60"); 
                u.setAttribute("x", "38"); 
            }
            u.setAttribute("y", item.y);
            gLeg.appendChild(u);

            let txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txt.setAttribute("x", "135"); 
            txt.setAttribute("y", item.y + 40); 
            txt.setAttribute("font-family", "Nunito");
            txt.setAttribute("font-size", "28"); 
            txt.setAttribute("font-weight", "900");
            txt.setAttribute("fill", "#000000");
            txt.textContent = item.text;
            gLeg.appendChild(txt);
        });
        
        layer.appendChild(gLeg);
    }

    // =========================================================
    // DECORAÇÕES E COLISÕES
    // =========================================================
    function embaralharDecoracoes(ptsOverride, wOverride) {
        let pts = ptsOverride || calcularPontosDaPista().pts;
        let w = wOverride || parseInt(document.getElementById('inp-largura').value);
        
        estado.decoracoes = [];
        let limit = 1000, count = 0;
        const types = ['dec-tree', 'dec-grass', 'dec-rock'];

        while(count < 25 && limit > 0) {
            limit--;
            let x = Math.random() * 2600 + 150;
            let y = Math.random() * 1450 + 550; 

            let safeDist = (w/2) + 120;
            let collided = false;
            for (let i = 0; i < pts.length; i += 15) { 
                if (Math.hypot(x - pts[i].x, y - pts[i].y) < safeDist) { collided = true; break; }
            }
            if (collided) continue;

            estado.decoracoes.push({
                t: types[Math.floor(Math.random() * types.length)],
                x: x, y: y,
                s: 0.8 + Math.random() * 0.7, 
                f: Math.random() > 0.5 ? -1 : 1 
            });
            count++;
        }
        desenharDecoracoesExistentes();
    }

    function desenharDecoracoesExistentes() {
        let layer = document.getElementById('layer-decoracoes');
        layer.innerHTML = "";
        
        estado.decoracoes.forEach(d => {
            let u = document.createElementNS("http://www.w3.org/2000/svg", "use");
            u.setAttribute("href", `#${d.t}`);
            let bw = (d.t === 'dec-tree') ? 160 : (d.t === 'dec-rock' ? 120 : 80);
            let bh = (d.t === 'dec-tree') ? 240 : (d.t === 'dec-rock' ? 75 : 65);
            u.setAttribute("x", d.x - bw/2);
            u.setAttribute("y", d.y - bh/2);
            u.setAttribute("width", bw);
            u.setAttribute("height", bh);
            u.setAttribute("transform", `translate(${d.x}, ${d.y}) scale(${d.s * d.f}, ${d.s}) translate(${-d.x}, ${-d.y})`);
            layer.appendChild(u);
        });
    }

    // =========================================================
    // LÓGICA DE JOGO E ESTADO DA PISTA
    // =========================================================
    function gerarEventosAutomaticos() {
        let t = parseInt(document.getElementById('inp-total').value);
        estado.casas = [];
        for (let i = 0; i < t; i++) {
            estado.casas.push({ tipo: '', valor: null });
        }

        let rules = [
            { t: 'pergunta', p: parseInt(document.getElementById('auto-p').value), v: null },
            { t: 'troca', p: parseInt(document.getElementById('auto-t').value), v: null },
            { t: 'avanca', p: parseInt(document.getElementById('auto-a').value), v: parseInt(document.getElementById('val-a').value) },
            { t: 'volta', p: parseInt(document.getElementById('auto-v').value), v: parseInt(document.getElementById('val-v').value) }
        ];

        let qtyPerguntas = 0;
        rules.forEach(r => {
            if (r.p > 0) {
                for (let i = r.p - 1; i < t - 1; i += r.p) {
                    if (i > 0 && i < t - 1 && estado.casas[i].tipo === '') {
                        estado.casas[i].tipo = r.t;
                        estado.casas[i].valor = r.v;
                        if(r.t === 'pergunta') qtyPerguntas++;
                    }
                }
            }
        });
        
        garantirCartasMinimas(qtyPerguntas);
        estado.selecionada = null;
        document.getElementById('lbl-casa').textContent = `Nenhuma`;
        atualizarTabuleiro();
    }

    function limparEventos() {
        estado.casas.forEach(c => { c.tipo = ''; c.valor = null; });
        estado.selecionada = null;
        document.getElementById('lbl-casa').textContent = `Nenhuma`;
        atualizarTabuleiro();
    }

    function selecionarCasa(index) {
        estado.selecionada = index;
        document.getElementById('lbl-casa').textContent = `Casa ${index + 1}`;
        atualizarTabuleiro();
    }

    function setEvento(tipo) {
        if (estado.selecionada === null) return alert("Selecione uma casa no tabuleiro primeiro!");
        let idx = estado.selecionada;
        if (idx === 0 || idx === estado.casas.length - 1) return alert("Não é possível colocar evento no Início ou Chegada.");
        
        estado.casas[idx].tipo = tipo;
        estado.casas[idx].valor = (tipo === 'avanca') ? parseInt(document.getElementById('val-a').value) : 
                                  (tipo === 'volta') ? parseInt(document.getElementById('val-v').value) : null;
        
        let qtyPerguntas = estado.casas.filter(c => c.tipo === 'pergunta').length;
        garantirCartasMinimas(qtyPerguntas);
        atualizarTabuleiro();
    }

    // =========================================================
    // GERENCIAMENTO DE CARTAS (MODAL)
    // =========================================================
    function garantirCartasMinimas(min) {
        while(estado.cartas.length < min) {
            estado.cartas.push({ pergunta: "Escreva o desafio aqui...", resposta: "R: ", regra: "Acertou: avança 1 | Errou: volta 1" });
        }
    }

    function abrirModalCartas() {
        document.getElementById('modal-cartas').style.display = 'flex';
        renderizarListaCartas();
    }

    function fecharModalCartas() {
        document.getElementById('modal-cartas').style.display = 'none';
    }

    function renderizarListaCartas() {
        let list = document.getElementById('modal-cartas-list');
        list.innerHTML = "";
        
        if(estado.cartas.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#64748b; font-weight:700;">Nenhuma carta criada. Clique em "Adicionar Carta" ou Importe um JSON.</p>`;
            return;
        }

        estado.cartas.forEach((c, i) => {
            let div = document.createElement('div');
            div.className = 'carta-item';
            div.innerHTML = `
                <h4>Carta ${i + 1} <button class="btn-remove" onclick="removerCartaUI(${i})">Excluir</button></h4>
                <label style="font-size:12px; font-weight:800; color:#475569;">Pergunta:</label>
                <textarea id="cartaq-${i}" rows="2">${c.pergunta}</textarea>
                <label style="font-size:12px; font-weight:800; color:#475569;">Regra/Consequência:</label>
                <input type="text" id="cartar-${i}" value="${c.regra}">
                <label style="font-size:12px; font-weight:800; color:#475569;">Resposta:</label>
                <input type="text" id="cartaa-${i}" value="${c.resposta}">
            `;
            list.appendChild(div);
        });
    }

    function adicionarCartaUI() {
        estado.cartas.push({ pergunta: "", resposta: "", regra: "" });
        renderizarListaCartas();
    }

    function removerCartaUI(index) {
        if(confirm("Tem certeza que deseja excluir esta carta?")) {
            estado.cartas.splice(index, 1);
            renderizarListaCartas();
        }
    }

    function salvarEFecharModal() {
        // Coleta todos os dados do DOM antes de fechar
        for(let i=0; i<estado.cartas.length; i++) {
            let q = document.getElementById(`cartaq-${i}`);
            let r = document.getElementById(`cartar-${i}`);
            let a = document.getElementById(`cartaa-${i}`);
            if(q && r && a) {
                estado.cartas[i] = { pergunta: q.value, regra: r.value, resposta: a.value };
            }
        }
        fecharModalCartas();
    }

    function importarJSON(e) {
        let file = e.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = evt => {
            try {
                let data = JSON.parse(evt.target.result);
                if (Array.isArray(data)) {
                    estado.cartas = data.map(c => ({
                        pergunta: c.pergunta || '',
                        resposta: c.resposta || '',
                        regra: c.regra || ''
                    }));
                    renderizarListaCartas();
                    alert(`${estado.cartas.length} cartas carregadas com sucesso!`);
                } else {
                    alert("Formato inválido. O arquivo JSON deve conter um Array de objetos.");
                }
            } catch(e) { alert("Erro ao interpretar o arquivo JSON."); }
        };
        reader.readAsText(file);
        e.target.value = null; // Reseta input
    }

    // =========================================================
    // PREPARAÇÃO PARA IMPRESSÃO
    // =========================================================
    function prepararImpressao() {
        let container = document.getElementById("print-cards-container");
        container.innerHTML = "";
        
        if (estado.cartas.length === 0) {
            window.print();
            return;
        }

        let showAns = document.getElementById('chk-show-answers').checked;
        let showGabarito = document.getElementById('chk-gabarito').checked;

        let itemsPerPage = 8;
        let paginas = Math.ceil(estado.cartas.length / itemsPerPage);

        // Gera as páginas de Cartas
        for (let p = 0; p < paginas; p++) {
            let divPage = document.createElement("div");
            divPage.className = "card-page";
            let grid = document.createElement("div");
            grid.className = "card-grid";

            for (let i = 0; i < itemsPerPage; i++) {
                let idx = p * itemsPerPage + i;
                let card = document.createElement("div");
                card.className = "card";
                
                if (idx < estado.cartas.length) {
                    let info = estado.cartas[idx];
                    card.innerHTML = `
                        <h4>Carta ${idx + 1}</h4>
                        <div class="card-q">${info.pergunta.replace(/\n/g, '<br>')}</div>
                        <div class="card-r">${info.regra}</div>
                        <div class="card-a" style="display: ${showAns ? 'block' : 'none'}">${info.resposta}</div>
                    `;
                }
                grid.appendChild(card);
            }
            divPage.appendChild(grid);
            container.appendChild(divPage);
        }

        // Gera página de Gabarito
        if (showGabarito) {
            let gabPage = document.createElement("div");
            gabPage.className = "card-page";
            gabPage.innerHTML = `<h1 class="gabarito-title">Gabarito - ${document.getElementById('inp-titulo').value}</h1>`;
            
            let gabGrid = document.createElement("div");
            gabGrid.className = "gabarito-grid";

            estado.cartas.forEach((c, i) => {
                let div = document.createElement('div');
                div.className = 'gab-item';
                div.innerHTML = `<strong>Carta ${i + 1}:</strong> ${c.resposta}`;
                gabGrid.appendChild(div);
            });
            
            gabPage.appendChild(gabGrid);
            container.appendChild(gabPage);
        }

        setTimeout(() => window.print(), 500);
    }

    // =========================================================
    // ARQUIVOS DO PROJETO
    // =========================================================
    function salvarArquivo() {
        let dados = {
            titulo: document.getElementById('inp-titulo').value,
            subtitulo: document.getElementById('inp-subtitulo').value,
            config: {
                total: document.getElementById('inp-total').value,
                largura: document.getElementById('inp-largura').value,
                linhas: document.getElementById('inp-linhas').value,
                colorido: document.getElementById('inp-colorido').checked
            },
            estado: estado
        };
        let blob = new Blob([JSON.stringify(dados)], { type: "application/json" });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'jornada_matematica.json';
        a.click();
    }

    function carregarArquivo(e) {
        let file = e.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = evt => {
            try {
                let dados = JSON.parse(evt.target.result);
                document.getElementById('inp-titulo').value = dados.titulo;
                document.getElementById('inp-subtitulo').value = dados.subtitulo;
                document.getElementById('inp-total').value = dados.config.total;
                document.getElementById('inp-largura').value = dados.config.largura;
                document.getElementById('inp-linhas').value = dados.config.linhas;
                document.getElementById('inp-colorido').checked = dados.config.colorido;
                estado = dados.estado;
                estado.selecionada = null;
                document.getElementById('lbl-casa').textContent = "Nenhuma";
                atualizarTabuleiro();
            } catch (err) { alert("Erro ao ler o arquivo do projeto."); }
        };
        reader.readAsText(file);
    }

    // Inicialização
    window.onload = () => gerarEventosAutomaticos();

</script>
